<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Left curly brace -->
  <path d="M80,30 Q55,30 55,60 L55,120 Q55,150 30,150 Q55,150 55,180 L55,240 Q55,270 80,270"
        fill="none" stroke="#5BB8D4" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right curly brace -->
  <path d="M220,30 Q245,30 245,60 L245,120 Q245,150 270,150 Q245,150 245,180 L245,240 Q245,270 220,270"
        fill="none" stroke="#5BB8D4" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Vertical line from top node down -->
  <line x1="150" y1="115" x2="150" y2="165" stroke="#5BB8D4" stroke-width="10" stroke-linecap="round"/>
  <!-- Horizontal line -->
  <line x1="100" y1="165" x2="200" y2="165" stroke="#5BB8D4" stroke-width="10" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="100" y1="165" x2="100" y2="195" stroke="#5BB8D4" stroke-width="10" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="200" y1="165" x2="200" y2="195" stroke="#5BB8D4" stroke-width="10" stroke-linecap="round"/>

  <!-- Top node (blue square with white inner square) -->
  <rect x="122" y="68" width="56" height="56" rx="8" ry="8" fill="#1E7FC2"/>
  <rect x="136" y="82" width="28" height="28" rx="4" ry="4" fill="white"/>

  <!-- Bottom-left node (green) -->
  <rect x="72" y="192" width="56" height="56" rx="8" ry="8" fill="#7AB317"/>

  <!-- Bottom-right node (green) -->
  <rect x="172" y="192" width="56" height="56" rx="8" ry="8" fill="#7AB317"/>
</svg>
